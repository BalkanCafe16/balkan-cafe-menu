<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menü - Çark ile İçecek Seçimi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; }

    /* Header Alanı */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .logo { font-weight: bold; font-size: 20px; color: #333; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    
    /* Çark Butonu (Dil seçeneğinin solunda) */
    .wheel-trigger-btn {
      background: linear-gradient(135deg, #ff7e5f, #feb47b);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(255, 126, 95, 0.3);
      transition: transform 0.2s;
    }
    .wheel-trigger-btn:hover { transform: scale(1.05); }
    .lang-select { border: 1px solid #ccc; padding: 6px 10px; border-radius: 8px; background: #fff; }

    /* Modal Sayfa Tasarımı */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .wheel-card {
      background: #fff;
      width: 90%;
      max-width: 450px;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      position: relative;
    }
    .close-btn {
      position: absolute; top: 15px; right: 20px;
      font-size: 24px; cursor: pointer; color: #888;
    }

    /* Kategori Sekmeleri */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
      margin-bottom: 15px;
    }
    .tab-btn {
      background: #eee;
      border: none;
      padding: 8px 14px;
      border-radius: 15px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 13px;
    }
    .tab-btn.active { background: #ff7e5f; color: #fff; font-weight: bold; }

    /* Çark ve İbre Alanı */
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto;
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 24px solid #e74c3c;
      z-index: 10;
    }
    canvas { width: 100%; height: 100%; border-radius: 50%; }

    /* Çevir Butonu */
    .spin-btn {
      margin-top: 20px;
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Sonuç Kutusu */
    .result-box {
      display: none;
      margin-top: 15px;
      padding: 10px;
      background: #e8f8f5;
      border: 1px solid #2ecc71;
      border-radius: 10px;
    }
    .order-btn {
      margin-top: 8px;
      background: #2980b9;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Üst Menü -->
  <header>
    <div class="logo">CafeQR</div>
    <div class="header-actions">
      <!-- Dil seçeneğinin solundaki çark butonu -->
      <button class="wheel-trigger-btn" onclick="toggleWheelModal(true)">
        <span>🎡</span> Ne İçsem?
      </button>
      <select class="lang-select">
        <option>TR</option>
        <option>EN</option>
      </select>
    </div>
  </header>

  <!-- Çark Modal Sayfası -->
  <div class="modal-overlay" id="wheelModal">
    <div class="wheel-card">
      <span class="close-btn" onclick="toggleWheelModal(false)">&times;</span>
      <h3>Ne İçeceğini Bilmiyor musun?</h3>
      <p style="font-size: 12px; color: #666; margin-bottom: 10px;">Kategorini seç, çarkı çevir!</p>
      
      <!-- Kategoriler -->
      <div class="category-tabs" id="categoryTabs"></div>

      <!-- Çark ve İbre -->
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="280" height="280"></canvas>
      </div>

      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Çarkı Çevir!</button>

      <!-- Sonuç Kutusu -->
      <div class="result-box" id="resultBox">
        <h4 id="resultText"></h4>
        <button class="order-btn" onclick="alert('Ürün sayfasına yönlendiriliyorsunuz...')">Sipariş Et / İncele</button>
      </div>
    </div>
  </div>

  <script>
    // Menü Verileri (Backend'den gelebilecek dinamik veri yapısı)
    const menuData = {
      hot: { name: "Sıcaklar", items: ["Demleme Çay", "Cappuccino", "Sahlep", "Sıcak Çikolata", "Espresso", "Bitki Çayı"] },
      cold: { name: "Soğuklar", items: ["Limonata", "Iced Latte", "Berry Hibiscus", "Cold Brew", "Sıkma Portakal"] },
      cocktails: { name: "Kokteyller", items: ["Mojito", "Pina Colada", "Blue Lagoon", "Espresso Martini"] }
    };

    const colors = ["#FF6384", "#36A2EB", "#FFCE56", "#4BC0C0", "#9966FF", "#FF9F40"];
    let currentCategory = "hot";
    let isSpinning = false;
    let currentAngle = 0;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // Kategorileri Arayüze Ekle
    function initTabs() {
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';
      Object.keys(menuData).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${key === currentCategory ? 'active' : ''}`;
        btn.innerText = menuData[key].name;
        btn.onclick = () => switchCategory(key);
        tabsContainer.appendChild(btn);
      });
    }

    // Kategori Değiştirme
    function switchCategory(key) {
      if (isSpinning) return;
      currentCategory = key;
      document.getElementById('resultBox').style.display = 'none';
      initTabs();
      drawWheel();
    }

    // Çarkı Çizme
    function drawWheel() {
      const items = menuData[currentCategory].items;
      const numSlices = items.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      items.forEach((item, index) => {
        const startAngle = index * sliceAngle + currentAngle;
        const endAngle = startAngle + sliceAngle;

        // Dilim Çizimi
        ctx.beginPath();
        ctx.moveTo(140, 140);
        ctx.arc(140, 140, 140, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();

        // Metin Çizimi
        ctx.save();
        ctx.translate(140, 140);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px Arial";
        ctx.fillText(item, 125, 4);
        ctx.restore();
      });
    }

    // Çarkı Çevirme Mantığı
    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('resultBox').style.display = 'none';

      const items = menuData[currentCategory].items;
      const spinAngle = Math.floor(Math.random() * 360) + 1440; // En az 4 tam tur
      const duration = 4000; // 4 saniye
      const start = performance.now();

      function animate(time) {
        const elapsed = time - start;
        const progress = Math.min(elapsed / duration, 1);
        
        // Yavaşlayan dönüş efekti (ease-out)
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = (spinAngle * easeOut * Math.PI) / 180;

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showResult(items);
        }
      }

      requestAnimationFrame(animate);
    }

    // Kazanan İçeceği Hesaplama ve Gösterme
    function showResult(items) {
      const numSlices = items.length;
      const sliceDegrees = 360 / numSlices;
      
      // Toplam dönülen dereceyi normalize et
      const actualDegrees = (currentAngle * 180 / Math.PI) % 360;
      
      // İbre üstte (270 derece konumunda) olduğu için kazananı hesapla
      const winningIndex = Math.floor((360 - (actualDegrees % 360) + 270) % 360 / sliceDegrees);
      
      const winner = items[winningIndex];
      document.getElementById('resultText').innerText = `Şansına Çıkan: ${winner}! 🍹`;
      document.getElementById('resultBox').style.display = 'block';
    }

    // Modal Göster/Gizle
    function toggleWheelModal(show) {
      document.getElementById('wheelModal').classList.toggle('active', show);
      if (show) {
        initTabs();
        drawWheel();
      }
    }
  </script>
</body>
</html>
