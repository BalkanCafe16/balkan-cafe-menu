<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balkan Cafe Menu</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 1.2rem;
            color: #e67e22;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 5px;
            margin-top: 25px;
        }
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .item-name {
            font-weight: 600;
        }
        .item-desc {
            font-size: 0.85rem;
            color: #777;
            margin-top: 3px;
        }
        .item-price {
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BALKAN CAFE</h1>
    <p class="subtitle">Hoş Geldiniz</p>

    <div class="section-title">Kahveler</div>
    <div class="menu-item">
        <div>
            <div class="item-name">Balkan Kahvesi</div>
            <div class="item-desc">Geleneksel sunumu ile</div>
        </div>
        <div class="item-price">60 TL</div>
    </div>
    <div class="menu-item">
        <div>
            <div class="item-name">Espresso</div>
        </div>
        <div class="item-price">50 TL</div>
    </div>
    <div class="menu-item">
        <div>
            <div class="item-name">Cappuccino</div>
        </div>
        <div class="item-price">70 TL</div>
    </div>

    <div class="section-title">Tatlılar</div>
    <div class="menu-item">
        <div>
            <div class="item-name">Trileçe</div>
            <div class="item-desc">Karamelli / Frambuazlı</div>
        </div>
        <div class="item-price">90 TL</div>
    </div>
    <div class="menu-item">
        <div>
            <div class="item-name">Boşnak Böreği</div>
            <div class="item-desc">Peynirli / Kıymalı</div>
        </div>
        <div class="item-price">85 TL</div>
    </div>
</div>

</body>
</html>
