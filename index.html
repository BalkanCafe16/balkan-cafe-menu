<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Balkan Cafe Logo</title>
  <style>
    body {
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .logo-container {
      width: 280px;
      height: 280px;
      background-color: #231f20;
      border-radius: 50%;
      border: 8px solid #f39c12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .badge {
      background-color: #ffffff;
      padding: 15px 25px;
      border-radius: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 0 0 2px #231f20;
    }

    .text-main {
      font-family: 'Brush Script MT', 'Caveat', cursive, sans-serif;
      font-size: 42px;
      font-weight: bold;
      color: #231f20;
      line-height: 0.9;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
    }

    .text-balkan {
      transform: rotate(-3deg);
    }

    .text-cafe {
      transform: rotate(-3deg);
      margin-left: 10px;
    }

    .text-sub {
      color: #f39c12;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 15px;
      text-transform: capitalize;
      position: relative;
    }

    .text-sub::before, .text-sub::after {
      content: "Wait...";
      content: "~~";
      position: absolute;
      top: 0;
      color: #f39c12;
      font-size: 12px;
    }

    .text-sub::before {
      left: -18px;
    }

    .text-sub::after {
      right: -18px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <div class="badge">
      <div class="text-main text-balkan">Balkan</div>
      <div class="text-main text-cafe">Cafe</div>
    </div>
    <div class="text-sub">Bi Kahve?</div>
  </div>

</body>
</html>
