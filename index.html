<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balkan Cafe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
            color: #4a3b32;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        /* ZİYARETÇİ SAYACI STİLİ */
        .visitor-counter {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #fef3c7;
            font-size: 0.85rem;
            color: #92400e;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .visitor-counter img {
            vertical-align: middle;
            border-radius: 4px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sayfa İçeriğiniz -->
        
        <!-- ZİYARETÇİ SAYACI -->
        <div class="visitor-counter">
            <span>Toplam Ziyaretçi:</span>
            <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fbalkancafe16.github.io&count_bg=%23D97706&title_bg=%23B45309&icon=&icon_color=%23E7E7E7&title=Say%C4%B1&edge_flat=false" alt="Ziyaretçi Sayısı">
        </div>
    </div>

</body>
</html>
